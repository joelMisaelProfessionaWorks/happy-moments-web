<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración - Happy Moments</title>
    <!-- Reutilizamos tu fuente -->
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;900&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css"> <!-- Reutiliza tu CSS general -->
    <style>
        /* Estilos específicos para el panel para que sea muy amigable */
        body {
            background-color: var(--laugh-color);
            color: var(--text-dark);
        }
        .admin-header {
            background-color: var(--logo);
            color: var(--text-logo);
            padding: 20px;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            border-bottom: 5px solid var(--text-logo);
        }
        .admin-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 20px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .admin-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--text-rosa);
            padding-bottom: 20px;
        }
        .btn-add {
            background-color: var(--logo);
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-add:hover { background-color: var(--card-purple); color: var(--text-dark); }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid var(--text-rosa);
        }
        th { background-color: var(--text-pink); color: var(--text-dark); }
        tr:hover { background-color: var(--laugh-color); }
        
        .action-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 5px;
        }
        .btn-edit { background-color: var(--logo-gold); color: var(--sad-color); }
        .btn-delete { background-color: #e74c3c; color: white; }

        /* Estilos del Modal (Formulario Emergente) */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 2000;
        }
        .modal-content {
            background: white; padding: 30px; border-radius: 15px; width: 90%; max-width: 500px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            border-top: 8px solid var(--logo);
        }
        .modal-content h2 { margin-bottom: 20px; color: var(--logo); font-family: 'Playfair Display', serif;}
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; color: var(--text-dark); }
        .form-group input, .form-group textarea {
            width: 100%; padding: 10px; border: 2px solid var(--text-rosa); border-radius: 5px;
            font-family: 'Montserrat', sans-serif;
            box-sizing: border-box;
        }
        .form-group input:focus, .form-group textarea:focus { outline: none; border-color: var(--logo); }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn-cancel { background-color: #ccc; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;}
        .btn-save { background-color: var(--logo); color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;}
    </style>
</head>
<body>

    <div class="admin-header">
        <div style="display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto;">
            <div style="font-size: 24px;"><i class="fa-solid fa-gear"></i> Panel de Administración - Happy Moments</div>
            <div>
                <button class="btn-add" style="background: white; color: var(--logo);" onclick="mostrarPestaña('productos')"><i class="fa-solid fa-box"></i> Productos</button>
                <button class="btn-add" style="background: white; color: var(--logo); margin-left: 10px;" onclick="mostrarPestaña('calendario')"><i class="fa-regular fa-calendar-days"></i> Calendario</button>
            </div>
        </div>
    </div>

    <div class="admin-container">
        
        <!-- PESTAÑA DE PRODUCTOS -->
        <div id="tab-productos">
            <div class="admin-controls">
                <h2>Catálogo de Productos</h2>
                <button class="btn-add" onclick="abrirModal()">
                    <i class="fa-solid fa-plus"></i> Nuevo Producto
                </button>
            </div>

            <div style="overflow-x: auto;">
                <table id="products-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Imagen</th>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-productos">
                        <!-- Se llenará con admin.js -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- PESTAÑA DE CALENDARIO -->
        <div id="tab-calendario" style="display: none;">
            <div class="calendar-section" style="box-shadow: none; padding-top: 0; margin-top: 0;">
                <h2 class="calendar-title" style="margin-top: 0;">Gestión de Fechas (Fines de semana 2026)</h2>
                <p style="text-align: center; margin-bottom: 20px; font-weight: bold;">Da clic en cualquier fecha para cambiar su estado y guardarlo en la nube automáticamente.</p>
                
                <div id="calendar-container" class="calendar-months">
                    <!-- Se llenará con admin.js -->
                </div>
                
                <div class="calendar-legend">
                    <div class="legend-item"><div class="legend-box blanco"></div> Disponible</div>
                    <div class="legend-item"><div class="legend-box azul"></div> En proceso</div>
                    <div class="legend-item"><div class="legend-box rojo"></div> Pagado</div>
                </div>
            </div>
        </div>

    </div>

    <!-- Modal Formulario -->
    <div class="modal" id="productoModal">
        <div class="modal-content">
            <h2 id="modal-title">Agregar Producto</h2>
            <form id="productoForm">
                <input type="hidden" id="prod-id">
                <div class="form-group">
                    <label>Nombre del Producto</label>
                    <input type="text" id="prod-nombre" required placeholder="Ej. Paquete 1">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="prod-desc" rows="3" required placeholder="Incluye brincolín, alberca..."></textarea>
                </div>
                <div class="form-group">
                    <label>Categoría</label>
                    <select id="prod-categoria" style="width: 100%; padding: 10px; border: 2px solid var(--text-rosa); border-radius: 5px; font-family: 'Montserrat', sans-serif;">
                        <option value="Mobiliario">Mobiliario Infantil</option>
                        <option value="Paquetes">Paquetes Especiales</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Precio</label>
                    <input type="text" id="prod-precio" required placeholder="Ej. 1100 o 3000 más flete">
                </div>
                <div class="form-group">
                    <label>Imagen del Producto</label>
                    <input type="file" id="prod-img-file" accept="image/*">
                    <input type="hidden" id="prod-img-url"> <!-- Aquí guardaremos la URL generada -->
                    <small id="img-status" style="color: #4B2C5E; display:block; margin-top:5px; font-weight:bold;"></small>
                </div>
                <div class="modal-buttons">
                    <button type="button" class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
